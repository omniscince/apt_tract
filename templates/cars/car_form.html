{% extends 'base.html' %}
{% block title %}{{ title }} - AutoPro{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="card p-4">
    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label">Customer *</label>
                {{ form.customer }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Make *</label>
                {{ form.make }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Model *</label>
                {{ form.model }}
            </div>
            <div class="col-md-4">
                <label class="form-label">Year</label>
                {{ form.year }}
            </div>
            <div class="col-md-4">
                <label class="form-label">Stock Number</label>
                {{ form.stock_number }}
            </div>
            <div class="col-md-4">
                <label class="form-label">VIN</label>
                {{ form.vin }}
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'car_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
