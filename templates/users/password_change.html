{% extends 'base.html' %}
{% block title %}Change Password - AutoPro{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block back_link %}<a href="#" onclick="history.back();return false;" class="hdr-back"><i class="bi bi-chevron-left"></i> Back</a>{% endblock %}

{% block content %}
<div class="page-inner">
    <div class="ap-card">
        <div style="padding:16px;">
            <form method="post">
                {% csrf_token %}
                {% for message in messages %}
                <div class="ap-alert ap-alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
                <div class="form-group">
                    <label class="ap-label">Current Password</label>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="ap-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="ap-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="ap-btn ap-btn-primary ap-btn-full">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
