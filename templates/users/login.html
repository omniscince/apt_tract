{% extends 'base.html' %}
{% block title %}Login - AutoPro{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">
            <div style="font-size:40px;">🚗</div>
            <p style="font-size:20px;font-weight:700;color:var(--text);margin:8px 0 4px;">AutoPro</p>
            <p style="color:var(--muted);font-size:14px;margin:0;">CRM System</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="ap-label">Email</label>
                {{ form.email }}
            </div>
            <div class="form-group">
                <label class="ap-label">Password</label>
                {{ form.password }}
            </div>
            {% if form.errors %}
            <div class="ap-alert ap-alert-danger">Invalid email or password.</div>
            {% endif %}
            <button type="submit" class="ap-btn ap-btn-primary ap-btn-full" style="margin-top:8px;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
